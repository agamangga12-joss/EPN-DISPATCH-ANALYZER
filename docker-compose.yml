services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dispatch} -d $${POSTGRES_DB:-dispatch_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "/venv/bin/python /pgadmin4/bootstrap.py && exec /entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_SERVER_JSON_FILE: /tmp/dispatch-servers.json
      PGPASS_FILE: /tmp/dispatch.pgpass
      APP_DB_NAME: ${POSTGRES_DB:-dispatch_intelligence}
      APP_DB_USER: ${POSTGRES_USER:-dispatch}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin/bootstrap.py:/pgadmin4/bootstrap.py:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dispatch:dispatch@db:5432/dispatch_intelligence}
      EXAMPLE_DATA_DIR: /app/example data
      IMPORT_UPLOAD_DIR: /app/import_uploads
      ML_ARTIFACT_DIR: /app/ml_artifacts
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173}
      GOOGLE_ROUTES_ENCRYPTION_KEY: ${GOOGLE_ROUTES_ENCRYPTION_KEY:-}
      PHASE10_RATE_LIMIT_PER_MINUTE: ${PHASE10_RATE_LIMIT_PER_MINUTE:-600}
      PHASE10_DEFAULT_TIMEZONE: ${PHASE10_DEFAULT_TIMEZONE:-Asia/Jakarta}
    volumes:
      - ./example data:/app/example data:ro
      - import_uploads:/app/import_uploads
      - ml_artifacts:/app/ml_artifacts
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  phase6-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.phase6_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dispatch:dispatch@db:5432/dispatch_intelligence}
      EXAMPLE_DATA_DIR: /app/example data
      ML_ARTIFACT_DIR: /app/ml_artifacts
      GOOGLE_ROUTES_ENCRYPTION_KEY: ${GOOGLE_ROUTES_ENCRYPTION_KEY:-}
      PHASE6_WORKER_POLL_SECONDS: ${PHASE6_WORKER_POLL_SECONDS:-1}
      PHASE6_WORKER_HEARTBEAT_SECONDS: ${PHASE6_WORKER_HEARTBEAT_SECONDS:-5}
      PHASE6_WORKER_LEASE_SECONDS: ${PHASE6_WORKER_LEASE_SECONDS:-30}
      PHASE6_PREDICTION_TIMEOUT_SECONDS: ${PHASE6_PREDICTION_TIMEOUT_SECONDS:-3600}
      PHASE6_PREDICTION_MAX_ATTEMPTS: ${PHASE6_PREDICTION_MAX_ATTEMPTS:-3}
    volumes:
      - ./example data:/app/example data:ro
      - ml_artifacts:/app/ml_artifacts
    depends_on:
      api:
        condition: service_healthy

  import-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.import_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dispatch:dispatch@db:5432/dispatch_intelligence}
      EXAMPLE_DATA_DIR: /app/example data
      IMPORT_UPLOAD_DIR: /app/import_uploads
      IMPORT_WORKER_POLL_SECONDS: ${IMPORT_WORKER_POLL_SECONDS:-1}
    volumes:
      - ./example data:/app/example data:ro
      - import_uploads:/app/import_uploads
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: apps/web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  pgadmin_data:
  import_uploads:
  ml_artifacts:
